- id: SPRINT2-001
  title: "Migration AES-256-CBC → AES-256-GCM avec prefix v2:"
  sprint: 2
  severity: P1
  findings: [SEC-100]
  category: security
  clever_specific: false
  risk_chain_id: oauth-creds-leak
  assignee_role: backend-security
  effort: M
  description: |
    packages/lib/crypto.ts:1-41 :
    - Nouveau encrypt/decrypt en aes-256-gcm, format `v2:iv:tag:ciphertext`
    - decrypt lit prefix : `v2:` → GCM, sans prefix → CBC legacy
    - À chaque decrypt CBC : re-encrypt en GCM côté caller (lazy migration)
    - Documenter une migration script optionnelle pour bulk re-encrypt
  acceptance:
    - "Tests unitaires : roundtrip GCM + decrypt legacy CBC"
    - "Manual : sample 10 credentials decrypt OK avant + après deploy"

