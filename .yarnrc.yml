compressionLevel: mixed

enableGlobalCache: false

nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.12.0.cjs

# Peer dependency mismatches are reported on every install (local and on deploy) and drown the
# real output; `yarn explain peer-requirements` still lists them on demand.
logFilters:
  - code: YN0002
    level: discard
  - code: YN0060
    level: discard
  - code: YN0086
    level: discard
  # Build scripts skipped on purpose (@prisma/client via dependenciesMeta, all of them when the deploy prunes devDependencies).
  - code: YN0004
    level: discard
  - code: YN0005
    level: discard
